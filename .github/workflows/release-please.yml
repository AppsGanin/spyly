name: release-please

# Prepares a release from ordinary commits: collects the changelog, bumps the
# version and keeps a pull request open. Merging that pull request creates the
# tag and the GitHub release, and then builds the app straight away.
#
# The package name in release-please-config.json is deliberately empty. With a
# name set, release-please compares it against the component in the release
# branch name — which a single-package manifest leaves empty — decides they
# disagree and silently skips creating the release.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release
    if: needs.release.outputs.released == 'true'
    permissions:
      contents: write
    secrets: inherit
    uses: ./.github/workflows/release-build.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
