name: release build

# Builds the app and attaches it to the release created by release-please.
#
# Called by the release-please workflow rather than started by the tag alone:
# a tag pushed with GITHUB_TOKEN never starts another workflow run, so an
# `on: push` trigger by itself would sit silent forever. The push trigger is
# kept for tags pushed by hand, and the dispatch one for rebuilding a release.
on:
  workflow_call:
    inputs:
      tag:
        description: Tag to build, for example v1.0.0
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build, for example v1.0.0
        type: string
        required: true
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    steps:
      # Empty on a tag push, where checkout defaults to the tag that started it.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Native parts
        run: npm run build:native

      # The certificate variables are exported only when the secrets exist.
      # Passing them through `env:` sets them to an empty string when a secret
      # is missing, and electron-builder reads an empty CSC_LINK as a path,
      # resolves it to the working directory and fails with "not a file".
      - name: Application
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          MAC_APPLE_ID: ${{ secrets.APPLE_ID }}
          MAC_APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          MAC_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$MAC_CERT_P12" ]; then
            export CSC_LINK="$MAC_CERT_P12"
            export CSC_KEY_PASSWORD="$MAC_CERT_PASSWORD"
            export APPLE_ID="$MAC_APPLE_ID"
            export APPLE_APP_SPECIFIC_PASSWORD="$MAC_APPLE_APP_PASSWORD"
            export APPLE_TEAM_ID="$MAC_APPLE_TEAM_ID"
          else
            # Nothing to sign with, and no keychain identity on a runner either.
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            echo "::warning::No Developer ID certificate. The build is signed ad-hoc, runs once the user allows it, and cannot update itself."
          fi
          npm run build
          npm run dist:mac -w @spyly/desktop -- --publish always
