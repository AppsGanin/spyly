name: release build

# Builds the app and attaches it to the release created by release-please.
#
# Called by the release-please workflow rather than started by the tag alone:
# a tag pushed with GITHUB_TOKEN never starts another workflow run, so an
# `on: push` trigger by itself would sit silent forever. The push trigger is
# kept for tags pushed by hand, and the dispatch one for rebuilding a release.
on:
  workflow_call:
    inputs:
      tag:
        description: Tag to build, for example v1.0.0
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build, for example v1.0.0
        type: string
        required: true
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    steps:
      # Empty on a tag push, where checkout defaults to the tag that started it.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Native parts
        run: npm run build:native

      - name: Application
        env:
          # On macOS an update only installs if the app is signed with a
          # Developer ID certificate: Squirrel checks the signature. Without
          # these secrets the build succeeds but will not update itself.
          CSC_LINK: ${{ secrets.MAC_CERT_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build && npm run dist:mac -w @spyly/desktop -- --publish always
