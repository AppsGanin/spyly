appId: com.spyly.app
electronVersion: '44.0.0'
afterPack: ../../build/after-pack.cjs
productName: Spyly
copyright: Spyly

directories:
  output: ../../release
  buildResources: ../../build

# Where the application looks for its updates.
publish:
  provider: github
  owner: AppsGanin
  repo: spyly

files:
  - out/**/*
  - package.json
  - '!**/*.map'

# The native parts go into Resources/bin: the capture helper, whisper with its
# libraries, and the MCP server that coding agents are pointed at.
extraResources:
  - from: ../../native/macos-audio/.build/release/spyly-audiotap
    to: bin/spyly-audiotap
  - from: ../../native/whisper/build/bin/whisper-cli
    to: bin/whisper-cli
  - from: ../../native/whisper/build/bin/whisper-server
    to: bin/whisper-server
  - from: ../../native/whisper/build/bin/parakeet-cli
    to: bin/parakeet-cli
  - from: ../../packages/mcp-server/dist/bundle.mjs
    to: mcp-server/bundle.mjs
  - from: ../../build/spyly-mcp
    to: bin/spyly-mcp
  - from: resources
    to: tray
    filter: ['tray*.png']
  # Russian wording for the macOS permission prompts. The English wording lives
  # in extendInfo below and is what a non-Russian system shows.
  - from: ../../build/ru.lproj/InfoPlist.strings
    to: ru.lproj/InfoPlist.strings

asarUnpack:
  # A native addon cannot be loaded out of an asar archive.
  - '**/node_modules/sherpa-onnx-node/**'
  - '**/*.node'

mac:
  icon: ../../build/icon.icns
  category: public.app-category.productivity
  # arm64 only: the native parts (the Swift helper and whisper.cpp) are built
  # for the architecture of the build machine, and an x64 package holding arm64
  # binaries simply will not start. Intel needs its own build:native run on x64.
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: ../../build/entitlements.mac.plist
  entitlementsInherit: ../../build/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: >-
      Spyly records your voice during a call so the conversation can be
      transcribed.
    NSAudioCaptureUsageDescription: >-
      Spyly records the call audio so the other participants can be transcribed.
    NSCalendarsUsageDescription: >-
      Spyly takes the meeting name and the participants from your calendar so a
      recording gets a meaningful name straight away.
    NSCalendarsFullAccessUsageDescription: >-
      Spyly reads calendar events to fill in the meeting name and participants.
      It changes nothing and sends nothing out.
    NSCameraUsageDescription: Spyly does not use the camera.
    LSUIElement: false

dmg:
  title: Spyly
  contents:
    - x: 140
      y: 190
      type: file
    - x: 400
      y: 190
      type: link
      path: /Applications

win:
  icon: ../../build/icon.png
  target:
    - target: nsis
      arch: [x64, arm64]

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

linux:
  icon: ../../build/icon.png
  category: Office
  target:
    - AppImage
    - deb
